name: release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: lint and test
    container: archlinux:latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install arch dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm rustup gcc pkgconf pacman

      - name: setup rust toolchain
        run: |
          rustup default stable
          rustup component add rustfmt clippy

      - name: check formatting
        run: cargo fmt -- --check

      - name: check portable build (--no-default-features)
        run: cargo check --no-default-features

      - name: run clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --no-default-features --all-targets -- -D warnings

      - name: run tests
        run: |
          cargo test --locked --verbose
          cargo test --no-default-features --verbose

  nix-flake:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: validate flake outputs
        run: nix flake show --no-write-lock-file

      - name: check flake and sandbox unit tests
        run: nix flake check --no-write-lock-file

      - name: verify built binaries and shell completions
        run: |
          nix build --no-write-lock-file .#default -o result-default
          ./result-default/bin/haj --version
          test -f ./result-default/share/bash-completion/completions/haj.bash
          test -f ./result-default/share/fish/vendor_completions.d/haj.fish
          test -f ./result-default/share/zsh/site-functions/_haj

          nix build --no-write-lock-file .#haj-alpm -o result-alpm
          ./result-alpm/bin/haj --version

  github-release:
    name: github release
    needs: [check, nix-flake]
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm rustup gcc pkgconf pacman

      - name: setup rust
        run: rustup default stable

      - name: build release binary
        run: cargo build --release --locked

      - name: package binary
        run: |
          tar czf haj-${{ github.ref_name }}-x86_64-linux.tar.gz \
          -C target/release haj

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          files: haj-*.tar.gz
          body_path: RELEASE.md

  cargo-publish:
    name: publish to crates.io
    needs: [check, nix-flake]
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm rustup gcc pkgconf pacman

      - name: setup rust
        run: rustup default stable

      - name: publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
