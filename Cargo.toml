[package]
name = "haj"
version = "0.1.0"
edition = "2021"
authors = ["asitos"]
description = "fast, quiet, beautiful package management for BlahArch"

[dependencies]
clap = { version = "4.4", features = ["derive"] }

alpm = { git = "https://github.com/archlinux/alpm.rs", branch = "master" }

tokio = { version = "1.34", features = ["full"] }
reqwest = "0.11"

indicatif = "0.17"
owo-colors = "3.5"

serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

anyhow = "1.0"

ratatui = "0.30.2"
crossterm = "0.29.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
