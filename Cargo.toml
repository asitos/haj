[package]
name = "haj"
version = "0.1.0"
edition = "2021"
authors = ["asitos <your.email@example.com>"]
description = "Fast, quiet, beautiful package management for BlahArch"

[dependencies]
clap = { version = "4.4", features = ["derive"] }

alpm = "3.0"

tokio = { version = "1.34", features = ["full"] }
reqwest = "0.11"

indicatif = "0.17"
owo-colors = "3.5"

serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
