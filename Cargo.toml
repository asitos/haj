[package]
name = "haj"
version = "0.2.7"
edition = "2024"
authors = ["asitos 4shut0shparashar@gmail.com"]
description = "fast, quiet, beautiful package manager and tui for blahArch Linux."
license = "MIT"
repository = "https://github.com/asitos/haj"
readme = "README.md"
keywords = ["archlinux", "pacman", "tui", "ratatui", "wrapper"]
categories = ["command-line-utilities"]
exclude = [
  "assets/*",
  # "resources/*",
  "target/*",
  ".git/*",
]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.5"

alpm = "5.0.2"

tokio = { version = "1.34", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"

indicatif = "0.17"
owo-colors = "3.5"

serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

anyhow = "1.0"

ratatui = "0.30.2"
crossterm = "0.29.0"
ansi-to-tui = "8.0.1"
directories = "6.0.0"
fs2 = "0.4.3"
libc = "0.2.189"
pacmanconf = "3.1.0"
dirs = "6.0.0"
chrono = "0.4.45"
scraper = "0.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
